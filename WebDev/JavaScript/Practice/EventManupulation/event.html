<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Manipulation</title>
    <style>
        /* Center everything using Flexbox */
        body {
            display: flex;
            justify-content: center;  /* Centers horizontally */
            align-items: center;      /* Centers vertically */
            height: 100vh;            /* Full viewport height */
            background-color: #f5f5f5;
            flex-direction: column;   /* Stack buttons vertically */
            gap: 10px;                /* Space between buttons */
            margin: 0;
        }

        button {
            margin: 10px;
            padding: 15px 20px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        button:first-child {
            background-color: black;
            color: white;
        }

        button:last-child {
            background-color: white;
            color: black;
            border: 2px solid black;
        }
    </style>

</head>
<body>
    <!-- First way  -->
    <!-- <button onclick="DarkMod()">DarkMod</button>
    <button onclick="LightMod()">LightMod</button> -->

    <!-- Second Way  -->
    <button>DarkMod</button>
    <button>LightMod</button>

    <script src="event.js">
    </script>
</body>
</html>
