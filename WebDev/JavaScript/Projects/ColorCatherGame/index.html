<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Color Cather Game</title>

        <!-- Linking CSS  -->
        <link rel="stylesheet" href="Style.css">
    </head>
    <body>
        <!-- for dark and light mode  -->
        <div class="mode"></div>

        <!-- main container -->
        <div class="game-container">
            <h1>🎯 Color Cather Game</h1>
            <p class="instruction">Click on the color: <span
                    id="target-color">#</span></p>
            <!-- color will be here  -->
            <div id="grid" class="color-grid"></div>

            <div class="stats">
                <p>⌛ Time Left: <span id="time">30</span> sec</p>
                <p>🏅 Score: <span id="score">0</span></p>
            </div>

            <!-- game over popup  -->
            <div id="popup" class="popup hidden">
                <div class="popup-content">
                    <h2>⌛ Time’s Up!</h2>
                    <p>Your final score: <span id="final-score"></span></p>
                    <button onclick="startGame()">Play Again</button>
                </div>
            </div>

            <button id="start-btn" onclick="startGame()">StartGame</button>

        </div>

        <!-- Linking Script/Js file  -->
        <script src="Script.js"></script>
    </body>
</html>
